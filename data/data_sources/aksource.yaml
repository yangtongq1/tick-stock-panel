name: aksource
display_name: AkShare 免费源
auth:
  type: none
datasets:
  daily:
    url: http://127.0.0.1:3021/daily
    method: POST
    batch: 100
    rpm: 120
    timeout: 120.0
    response_path: data
    field_map:
      symbol: symbol
      date: date
      open: open
      high: high
      low: low
      close: close
      volume: volume
      amount: amount
    symbols_param: symbols
    start_param: start_time
    end_param: end_time
  adj_factor:
    url: http://127.0.0.1:3021/adj_factor
    method: POST
    batch: 20
    rpm: 10
    timeout: 300.0
    response_path: data
    field_map:
      symbol: symbol
      trade_date: trade_date
      ex_factor: ex_factor
    symbols_param: symbols
    start_param: start_time
    end_param: end_time
  realtime:
    url: http://127.0.0.1:3021/realtime
    method: GET
    rpm: 6
    timeout: 120.0
    pct_unit: decimal
    response_path: data
    field_map:
      symbol: symbol
      name: name
      last_price: last_price
      prev_close: prev_close
      open: open
      high: high
      low: low
      volume: volume
      amount: amount
      change_pct: change_pct
      change_amount: change_amount
      amplitude: amplitude
      turnover_rate: turnover_rate
  minute:
    url: http://127.0.0.1:3021/minute
    method: POST
    batch: 30
    rpm: 30
    timeout: 180.0
    response_path: data
    field_map:
      symbol: symbol
      datetime: datetime
      open: open
      high: high
      low: low
      close: close
      volume: volume
    symbols_param: symbols
    start_param: start_time
    end_param: end_time
  full_minute:
    url: http://127.0.0.1:3021/full_minute
    method: POST
    batch: 30
    rpm: 30
    timeout: 300.0
    response_path: data
    field_map:
      symbol: symbol
      datetime: datetime
      open: open
      high: high
      low: low
      close: close
      volume: volume
    symbols_param: symbols
    start_param: start_time
    end_param: end_time
  depth5:
    url: http://127.0.0.1:3021/depth5
    method: POST
    batch: 30
    rpm: 30
    timeout: 60.0
    response_path: data
    field_map:
      code: symbol
      sell: asks
      buy: bids
    symbols_param: symbols
    start_param: start_time
    end_param: end_time
  financial:
    url: http://127.0.0.1:3021/financial
    method: POST
    batch: 50
    rpm: 30
    timeout: 300.0
    response_path: data
    field_map:
      symbol: symbol
      period_end: period_end
      eps_basic: eps_basic
      roe: roe
      gross_margin: gross_margin
      net_margin: net_margin
      debt_to_asset_ratio: debt_to_asset_ratio
      revenue_yoy: revenue_yoy
      net_income_yoy: net_income_yoy
      bps: bps
      revenue: revenue
      operating_cost: operating_cost
      selling_expense: selling_expense
      admin_expense: admin_expense
      rd_expense: rd_expense
      operating_profit: operating_profit
      financial_expense: financial_expense
      total_profit: total_profit
      income_tax: income_tax
      net_income: net_income
      net_income_attributable: net_income_attributable
      basic_eps: basic_eps
      cash_and_equivalents: cash_and_equivalents
      accounts_receivable: accounts_receivable
      total_current_assets: total_current_assets
      total_non_current_assets: total_non_current_assets
      total_assets: total_assets
      total_liabilities: total_liabilities
      total_equity: total_equity
      net_operating_cash_flow: net_operating_cash_flow
      net_investing_cash_flow: net_investing_cash_flow
      net_financing_cash_flow: net_financing_cash_flow
      capex: capex
      net_cash_change: net_cash_change
    symbols_param: symbols
    start_param: start_time
    end_param: end_time
